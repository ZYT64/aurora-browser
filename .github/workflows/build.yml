name: aurora-fp-build

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'probe = 环境探测；build-depot = fetch 实机；build = F1 版构建；build-full = F1-F8 全补丁构建'
        required: true
        default: 'probe'
        type: choice
        options:
          - probe
          - build-depot
          - build
          - build-full
      persona_file:
        description: 'persona JSON 路径（仓库内相对路径）'
        required: false
        default: 'persona/persona.example.json'

jobs:
  probe:
    if: inputs.stage == 'probe'
    runs-on: ubuntu-latest
    steps:
      - name: Runner 规格与磁盘基线
        run: |
          echo "=== CPU/内存 ==="
          nproc; free -h
          echo "=== 磁盘 ==="
          df -h / /mnt /tmp 2>/dev/null
          echo "=== 网络连通性（拉源码用） ==="
          curl -s -m 15 -o /dev/null -w 'chromium.googlesource: %{http_code} %{time_total}s\n' https://chromium.googlesource.com/ || true
          curl -s -m 15 -o /dev/null -w 'github raw: %{http_code} %{time_total}s\n' https://raw.githubusercontent.com/ || true
      - name: depot_tools 版本
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"
          export PATH="$HOME/depot_tools:$PATH"
          cd "$HOME/depot_tools"
          ./ensure_bootstrap || gclient --version
          ls -la python3_bin_reldir.txt
          gclient --version && echo "depot_tools OK"

  build-depot:
    if: inputs.stage == 'build-depot'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: depot_tools 安装
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"
      - name: 初始化 depot_tools（必须，否则 fetch 假成功）
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          cd "$HOME/depot_tools"
          ls -la python3_bin_reldir.txt 2>/dev/null || echo "python3_bin_reldir.txt 缺失 → 执行 ensure_bootstrap"
          ./ensure_bootstrap || gclient --version
          ls -la python3_bin_reldir.txt
      - name: fetch 源码骨架（浅克隆·计时）
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          mkdir -p "$HOME/chromium" && cd "$HOME/chromium"
          # flags 必须全部前置（argparse 在 positional 之后的 flag 会解析失败）
          time fetch --no-history --nohooks chromium 2>&1 | tail -30
          echo "=== fetch 后磁盘占用 ==="
          du -sh "$HOME/chromium/src" || du -sh "$HOME/chromium"
          du -sh "$HOME/chromium/src/test" 2>/dev/null || echo "test/ 不存在"
          df -h /
      - name: 实机记录
        if: always()
        run: |
          {
            echo "=== 磁盘最终状态 ==="
            du -sh "$HOME/chromium"/* 2>/dev/null | sort -rh | head -20
            df -h /
          } | tee fetch_report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fetch-report
          path: fetch_report.txt
          retention-days: 5

  build-full:
    if: inputs.stage == 'build-full'
    runs-on: ubuntu-latest
    timeout-minutes: 356
    steps:
      - uses: actions/checkout@v4
      - name: ccache 缓存恢复（首轮无缓存，后续轮编译大幅提速）
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-full-${{ github.run_id }}
          restore-keys: |
            ccache-full-
      - name: depot_tools + python 基件
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-pip git curl pkg-config libssl-dev libgbm-dev ccache || true
      - name: 初始化 depot_tools（必须，否则 fetch 假成功）
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          cd "$HOME/depot_tools"
          ./ensure_bootstrap || gclient --version
          ls -la python3_bin_reldir.txt
      - name: fetch 源码（浅克隆）
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          mkdir -p "$HOME/chromium" && cd "$HOME/chromium"
          time fetch --no-history --nohooks chromium 2>&1 | tail -30
          du -sh "$HOME/chromium/src"
          df -h /
          # 磁盘实测：fetch 后约 90G used / 56G 剩，足够 content_shell 编译，不再删任何目录
          # （web_tests 被主 BUILD.gn 的 wpt_tests target 引用，删了 gn gen 会挂）
      - name: 安装构建依赖（install-build-deps，容忍个别包失败）
        run: |
          cd "$HOME/chromium/src"
          export PATH="$HOME/depot_tools:$PATH"
          sudo ./build/install-build-deps.sh --no-prompt 2>&1 | tail -20 || echo "install-build-deps 部分失败，继续尝试 runhooks"
      - name: gclient runhooks（下载 clang 工具链/sysroot，编译前置）
        run: |
          cd "$HOME/chromium/src"
          export PATH="$HOME/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          time gclient runhooks 2>&1 | tail -30
          df -h /
      - name: 生成 persona header + 打 F1 补丁
        run: |
          cd "$GITHUB_WORKSPACE"
          # 应用 F1 补丁（精确锚点替换，不依赖行号）
          python3 "$GITHUB_WORKSPACE/scripts/apply_f1.py" "$HOME/chromium/src"
          # persona header 扩散：所有 include aurora_persona.h 的目录都要有这个头（F1-F8 引用多个子目录）
          grep -rl 'aurora_persona\.h' "$HOME/chromium/src/third_party/blink" 2>/dev/null | xargs -r -n1 dirname | sort -u | while read -r d; do
            cp "$GITHUB_WORKSPACE/src-overlay/aurora_persona.h" "$d/aurora_persona.h"
          done
          echo "persona header 已扩散到:"; find "$HOME/chromium/src/third_party/blink" -name 'aurora_persona.h'
          grep -n 'kAuroraGLRenderer\|aurora_persona' "$HOME/chromium/src/third_party/blink/renderer/modules/webgl/webgl_rendering_context_base.cc" | head -5
      - name: GN 生成
        run: |
          cd "$HOME/chromium/src"
          export PATH="$HOME/depot_tools:$PATH"
          # 非 official release：编译快、无 PGO 依赖；symbol_level=0 省内存磁盘
          gn gen out/Release --args='is_official_build=false is_debug=false is_component_build=false target_cpu="x64" symbol_level=0 blink_symbol_level=0 v8_symbol_level=0 cc_wrapper="ccache" treat_warnings_as_errors=false'
      - name: 编译 content_shell（最多 300 分钟，自动用 autoninja 并行）
        run: |
          cd "$HOME/chromium/src"
          export PATH="$HOME/depot_tools:$PATH"
          time autoninja -C out/Release content_shell
          ccache -s | tail -8
      - name: 验证内容
        run: |
          cd "$HOME/chromium/src"
          ls -lh out/Release/content_shell || ls -lh out/Release/headless_shell
          file out/Release/content_shell || true
      - name: 验收 UNMASKED=persona
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/verify_f1.py" "$HOME/chromium/src/out/Release/content_shell" "$GITHUB_WORKSPACE/persona/persona.example.json"
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-fp-content-shell
          path: |
            ~/chromium/src/out/Release/content_shell
            ~/chromium/src/out/Release/*.so
          retention-days: 5
          if-no-files-found: error

  build-full-impl:
    if: inputs.stage == 'build-full'
    needs: []
    runs-on: ubuntu-latest
    timeout-minutes: 356
    steps:
      - uses: actions/checkout@v4
      - name: ccache 缓存恢复（首轮无缓存，后续轮编译大幅提速）
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-impl-${{ github.run_id }}
          restore-keys: |
            ccache-impl-
      - name: depot_tools + 依赖 + 初始化（同 build）
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"
          cd "$HOME/depot_tools" && ./ensure_bootstrap
      - name: fetch 源码
        run: |
          export PATH="$HOME/depot_tools:$PATH"; export DEPOT_TOOLS_UPDATE=0
          mkdir -p "$HOME/chromium" && cd "$HOME/chromium"
          time fetch --no-history --nohooks chromium 2>&1 | tail -5
      - name: install-build-deps + runhooks
        run: |
          cd "$HOME/chromium/src"; export PATH="$HOME/depot_tools:$PATH"
          sudo ./build/install-build-deps.sh --no-prompt 2>&1 | tail -5 || true
          gclient runhooks 2>&1 | tail -5
      - name: F1-F8 全补丁链式应用（apply_all）
        run: |
          bash "$GITHUB_WORKSPACE/scripts/apply_all.sh" "$HOME/chromium/src" "$GITHUB_WORKSPACE/persona/persona.example.json"
          # persona header 扩散 v2：
          # ① 按文件所在目录放（include 写相对名时兜底）
          grep -rl 'aurora_persona\.h' "$HOME/chromium/src/third_party/blink" 2>/dev/null | xargs -r -n1 dirname | sort -u | while read -r d; do
            cp "$GITHUB_WORKSPACE/src-overlay/aurora_persona.h" "$d/aurora_persona.h"
          done
          # ② 按 include 写的完整路径放（include 写 third_party/... 全路径时必须放全路径处，否则 fatal file not found）
          grep -rl 'aurora_persona\.h' "$HOME/chromium/src/third_party/blink" 2>/dev/null | while read -r f; do
            grep -ho '"third_party/[^"]*aurora_persona\.h"' "$f" 2>/dev/null | tr -d '"' | sort -u | while read -r inc; do
              tgt="$HOME/chromium/src/$inc"
              if [ ! -f "$tgt" ]; then mkdir -p "$(dirname "$tgt")"; cp "$GITHUB_WORKSPACE/src-overlay/aurora_persona.h" "$tgt"; fi
            done
          done
          echo "persona header 已扩散到:"; find "$HOME/chromium/src" -name 'aurora_persona.h' | sort
      - name: GN + 编译
        run: |
          cd "$HOME/chromium/src"; export PATH="$HOME/depot_tools:$PATH"
          sudo apt-get install -y -qq ccache || true
          gn gen out/Release --args='is_official_build=false is_debug=false is_component_build=false target_cpu="x64" symbol_level=0 blink_symbol_level=0 v8_symbol_level=0 cc_wrapper="ccache" treat_warnings_as_errors=false'
          autoninja -C out/Release content_shell
          ccache -s | tail -8
      - name: 验收全指纹面
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/verify_f1.py" "$HOME/chromium/src/out/Release/content_shell" "$GITHUB_WORKSPACE/persona/persona.example.json"
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-fp-full-content-shell
          path: ~/chromium/src/out/Release/content_shell
          retention-days: 5
          if-no-files-found: error
